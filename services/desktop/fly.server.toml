# AVA headless auf Fly (docs/PLAN_AVA_CLOUD.md §12). Ein App = ein Konto.
# Deploy mit der Repo-Wurzel als Build-Kontext (erstes Argument), Token nur fuer
# das Vendoring; der Dockerfile-Pfad gilt relativ zu dieser Datei:
#   fly deploy "$(git rev-parse --show-toplevel)" -c services/desktop/fly.server.toml --build-secret npm_token="$NPM_TOKEN"
# Erstes Mal: fly apps create headless-ava; das Volume legt der Deploy ueber [mounts] an.
# Secrets einmalig: fly secrets set AVA_SECRETS_KEY=$(openssl rand -hex 32) AVA_SETUP_TOKEN=$(openssl rand -base64 18)
app = "headless-ava"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.server"

[env]
  AVA_SERVER_BIND = "0.0.0.0"
  AVA_SERVER_PORT = "8080"
  # Ollama-Sidecar (infra/fly-ollama/fly.toml) ueber das private Fly-Netz; dient
  # den Embeddings (embeddinggemma). Chat/Producer laufen ueber Schluessel oder Abo.
  AVA_OLLAMA_HOST = "ava-ollama.internal"
  AVA_OLLAMA_PORT = "11434"
  AVA_DISABLE_OLLAMA = "0"
  LOGLEVEL = "info"

# Ein Konto, ein Prozess, keine Skalierung: der Kopf haelt Zustand (PGlite, Stores).
[http_service]
  internal_port = 8080
  force_https = true
  # AVA laeuft dauerhaft (Herzschlag, Telegram, Producer); nie schlafen legen.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 25

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "90s"
  method = "GET"
  path = "/healthz"

[mounts]
  source = "ava_data"
  destination = "/data"
  initial_size = "10gb"

[[vm]]
  # Kopf + sechs Producer + Chromium: 4 GB reichen fuer eine Firma parallel, 8 GB fuer Last.
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2
