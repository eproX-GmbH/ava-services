# Betreiber-Fallback-Worker fuer das Register-Delta (S5). Kein HTTP-Dienst,
# eine Maschine je Region = eine IP = 60 Abfragen je Stunde. Secrets:
#   INTERNAL_HMAC_SECRET   gleicher Wert wie ava-db-gateway / ava-master-data
app = 'ava-register-worker'
primary_region = 'fra'

[build]

[env]
  GATEWAY_URL = 'https://ava-db-gateway.fly.dev'
  ABFRAGEN_JE_STUNDE = '60'
  # WORKER_ID wird aus dem Hostnamen (Maschinen-Id) gebildet.

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

# Zwei Prozesse (je eine Maschine): `worker` bedient alle Job-Arten mit dem
# Registerportal-Takt (60/h, Browser); `worker_at` nur Oesterreich (JSON,
# Ediktsdatei, 0,5/s, kein Browser), damit die Aufzaehlung nicht hinter den
# deutschen Jobs wartet. REGISTER_DELTA_AT=0 haelt den DE-Worker von AT fern.
[processes]
  worker = 'sh -c "REGISTER_DELTA_AT=0 node dist/cli.js"'
  worker_at = 'sh -c "REGISTER_DELTA_ARTEN=at_front,at_refresh,at_insolvenz WORKER_ID=betreiber-at node dist/cli.js"'
