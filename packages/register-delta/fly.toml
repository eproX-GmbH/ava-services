# Betreiber-Fallback-Worker fuer das Register-Delta (S5). Kein HTTP-Dienst,
# eine Maschine je Region = eine IP = 60 Abfragen je Stunde. Secrets:
#   INTERNAL_HMAC_SECRET   gleicher Wert wie ava-db-gateway / ava-master-data
app = 'ava-register-worker'
primary_region = 'fra'

[build]

[env]
  GATEWAY_URL = 'https://ava-db-gateway.fly.dev'
  ABFRAGEN_JE_STUNDE = '60'
  # WORKER_ID wird aus dem Hostnamen (Maschinen-Id) gebildet.

# DE-Worker faehrt Chromium: mit 1 GB blieben nach ein paar Tagen ~60 MB frei
# und jeder Browserstart scheiterte ("DevToolsActivePort file doesn't exist",
# 2026-10-12). worker_at kommt ohne Browser aus.
[[vm]]
  processes = ['worker']
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1

[[vm]]
  processes = ['worker_at']
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

# Je Land eine Maschine (2026-10-25): der UK-Monatsabzug belegte worker_at
# wochenlang, Oesterreich und die Schweiz (gleiche Prioritaet) kamen erst danach
# dran. uk_bulk laedt je Teil rund 70 MB nach /tmp.
[[vm]]
  processes = ['worker_uk']
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[vm]]
  processes = ['worker_ch']
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[vm]]
  processes = ['worker_no']
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

# Fuenf Prozesse (je eine Maschine): `worker` bedient die deutschen Job-Arten
# mit dem Registerportal-Takt (60/h, Browser); die anderen laufen ohne Browser:
# `worker_at` Oesterreich (JustizOnline, Ediktsdatei), `worker_uk` das Vereinigte
# Koenigreich (Companies House, Gazette), `worker_ch` die Schweiz (Zefix und
# LINDAS, Secrets ZEFIX_USER/ZEFIX_PASSWORD), `worker_no` Norwegen (Brreg, offen).
# Jedes Land wartet so nur auf sich
# selbst. REGISTER_DELTA_AT/UK=0 halten den DE-Worker davon fern.
# S8 (2026-09-17): refresh-Jobs laden den strukturierten Registerinhalt mit
# (REGISTER_DELTA_SI, Standard an; jede Firma kostet zwei Abfragen).
[processes]
  worker = 'sh -c "REGISTER_DELTA_AT=0 REGISTER_DELTA_UK=0 node dist/cli.js"'
  # uk_bulk schonend (2026-09-16): 250 Zeilen je Buendel, 20 s Pause; master-data war
  # bei 1000 Zeilen ohne Pause dauerhaft CPU-gedrosselt (Erstimport dauert so ~3 Tage).
  worker_at = 'sh -c "REGISTER_DELTA_ARTEN=at_front,at_refresh,at_insolvenz WORKER_ID=betreiber-at node dist/cli.js"'
  worker_uk = 'sh -c "REGISTER_DELTA_ARTEN=uk_bulk,uk_refresh,uk_insolvenz REGISTER_DELTA_UK_BUENDEL=250 REGISTER_DELTA_UK_PAUSE_MS=20000 WORKER_ID=betreiber-uk node dist/cli.js"'
  # Schweiz: Zefix (Secrets ZEFIX_USER/ZEFIX_PASSWORD) und LINDAS, kein Browser.
  worker_ch = 'sh -c "REGISTER_DELTA_ARTEN=ch_bulk,ch_sogc,ch_refresh WORKER_ID=betreiber-ch node dist/cli.js"'
  # Norwegen: Brreg offen ohne Schluessel; no_bulk laedt ~80 MB gz nach /tmp.
  worker_no = 'sh -c "REGISTER_DELTA_ARTEN=no_bulk,no_oppdatering,no_refresh WORKER_ID=betreiber-no node dist/cli.js"'
