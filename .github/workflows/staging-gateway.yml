# Staging/UAT (docs/PLAN_STAGING.md ST6): Jeder Tag v* rollt das Gateway als KANDIDAT nach
# ava-db-gateway-staging aus (Prod-Daten, nur Staging-Konten). Vorher die Migrationspruefung:
# das Staging-Deploy wendet Migrationen auf die Prod-Datenbank an, daher nur additive.
#
# Secrets:
#   FLY_STAGING_GATEWAY_TOKEN  Deploy-Token nur fuer ava-db-gateway-staging
#                              (`fly tokens create deploy -a ava-db-gateway-staging`)
#   NPM_TOKEN                  wie im Server-Image (GitLab-Paketregistry)
name: Staging gateway

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, der nach Staging geht (muss existieren), z. B. v0.1.977"
        required: true

concurrency:
  group: staging-gateway
  cancel-in-progress: false

jobs:
  deploy-staging-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Migrationspruefung (nur additive Aenderungen)
        working-directory: services/db-gateway
        run: node scripts/migration-pruefen.mjs

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Staging-Gateway ausrollen
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_GATEWAY_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "::error::FLY_STAGING_GATEWAY_TOKEN fehlt."; exit 1; fi
          flyctl deploy services/db-gateway \
            -c services/db-gateway/fly.staging.toml \
            -a ava-db-gateway-staging \
            --remote-only --ha=false \
            --release-command-timeout 10m \
            --build-secret "npm_token=$NPM_TOKEN"
