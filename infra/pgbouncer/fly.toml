# ava-pgbouncer (docs/PLAN_PGBOUNCER.md) — nur im privaten Fly-Netz erreichbar:
# ava-pgbouncer.internal:6432. Kein oeffentlicher Port. Secrets:
#   DB_HOST     pgbouncer.<cluster>.flympg.net (Anbieter-PgBouncer)
#   DB_USER     fly-user
#   DB_PASSWORD
app = 'ava-pgbouncer'
primary_region = 'fra'

[build]

[env]
  POOL_MODE = 'transaction'
  DEFAULT_POOL_SIZE = '4'
  MAX_DB_CONNECTIONS = '6'
  SERVER_IDLE_TIMEOUT = '60'
  MAX_CLIENT_CONN = '500'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[processes]
  bouncer = '/entrypoint.sh'

# Oeffentlicher Zugang fuer die lokalen Producer der Nutzer: rohes TCP, der
# Bouncer beendet TLS selbst (Postgres-Protokoll verhandelt TLS erst nach dem
# SSLRequest, ein Fly-TLS-Handler passt dazu nicht). Selbstsigniertes
# Zertifikat, Clients mit sslmode=require (Verschluesselung ohne CA-Pruefung).
# Dedizierte IPv4 noetig.
[[services]]
  internal_port = 6432
  protocol = 'tcp'
  processes = ['bouncer']
  [[services.ports]]
    port = 5432
    handlers = []

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '3s'
