# AVA-Router (docs/PLAN_AVA_CLOUD.md §14): *.ava.bi → Server-Instanz des Kunden
# per fly-replay. Muss in derselben Fly-Organisation laufen wie die Instanzen.
#   fly apps create ava-router
#   fly deploy infra/fly-router            (Kontext = dieser Ordner)
#   fly ips allocate-v4 --shared -a ava-router && fly ips allocate-v6 -a ava-router
#   fly certs add "*.ava.bi" -a ava-router  → DNS-Einträge, die fly anzeigt, beim Domain-Anbieter setzen
app = "ava-router"
primary_region = "fra"

[env]
  ROUTER_DOMAIN = "ava.bi"
  ROUTER_APP_PREFIX = "ava-i-"
  # Ausnahmen von der Namensregel (Subdomain=App), z. B. die erste Instanz des Operators.
  ROUTER_ZUORDNUNG = "headless-ava=headless-ava"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 500
    hard_limit = 1000

[[http_service.checks]]
  interval = "30s"
  timeout = "3s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
